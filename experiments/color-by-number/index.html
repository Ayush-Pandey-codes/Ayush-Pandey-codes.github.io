<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Color Studio</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="app-header">
    <div class="brand">
      <div class="brand-icon">🎨</div>
      <div>
        <h1>Color Studio</h1>
        <p>Relaxing coloring studio for every skill level</p>
      </div>
    </div>

    <nav class="mode-tabs">
      <button class="mode-tab active" data-mode="easy">Easy Pixel</button>
      <button class="mode-tab" data-mode="advanced">Advanced Pixel Art</button>
      <button class="mode-tab" data-mode="classic">Classic Illustrated</button>
    </nav>
  </header>

  <main class="app-main">

    <section class="gallery-section">
      <div class="section-head">
        <h2>Choose an artwork</h2>
        <div class="gallery-filters">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="easy">Easy</button>
          <button class="filter-btn" data-filter="advanced">Advanced</button>
          <button class="filter-btn" data-filter="classic">Classic</button>
        </div>
      </div>

      <div class="gallery" id="gallery"></div>
    </section>

    <section class="studio-section hidden" id="studio">
      <div class="studio-top">
        <button class="back-btn" id="backBtn">← Back to gallery</button>
        <h2 id="artworkTitle">Artwork</h2>
        <div class="progress-wrap">
          <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
          </div>
          <span id="progressText">0% complete</span>
        </div>
      </div>

      <div class="studio-layout">

        <aside class="palette-panel">
          <h3>Colors</h3>
          <div class="palette" id="palette"></div>

          <div class="palette-actions">
            <button class="small-btn" id="autoNextBtn">Auto-select next</button>
            <button class="small-btn" id="nextUnfinishedBtn">Next unfinished</button>
            <button class="small-btn danger" id="clearSelectionBtn">Clear selection</button>
          </div>
        </aside>

        <div class="canvas-panel">
          <div class="canvas-tools">
            <button class="tool-btn active" data-tool="brush" title="Color brush">🖌️ Brush</button>
            <button class="tool-btn" data-tool="eraser" title="Eraser">🧽 Eraser</button>
            <button class="tool-btn" data-tool="fill" title="Fill area">🪣 Fill</button>
            <button class="tool-btn" id="undoBtn" title="Undo">↩️ Undo</button>
            <button class="tool-btn" id="redoBtn" title="Redo">↪️ Redo</button>
            <button class="tool-btn" id="hintBtn" title="Reveal one cell">💡 Hint</button>
          </div>

          <div class="canvas-view">
            <div class="pixel-canvas" id="pixelCanvas"></div>
          </div>

          <div class="canvas-footer">
            <button class="small-btn" id="zoomOutBtn">− Zoom out</button>
            <span id="zoomLabel">100%</span>
            <button class="small-btn" id="zoomInBtn">+ Zoom in</button>
            <button class="small-btn" id="resetBtn">Reset artwork</button>
          </div>
        </div>

        <aside class="settings-panel">
          <h3>View & export</h3>

          <label class="toggle-row">
            <input type="checkbox" id="showNumbers" checked />
            <span>Show color numbers</span>
          </label>

          <label class="toggle-row">
            <input type="checkbox" id="showGrid" checked />
            <span>Show pixel grid</span>
          </label>

          <label class="toggle-row">
            <input type="checkbox" id="highlightColor" checked />
            <span>Highlight selected color</span>
          </label>

          <div class="export-actions">
            <button class="primary-btn" id="exportBtn">Export PNG</button>
            <button class="secondary-btn" id="printBtn">Print</button>
          </div>

          <div class="saved-section">
            <h3>Saved artwork</h3>
            <div class="saved-list" id="savedList"></div>
          </div>
        </aside>

      </div>
    </section>

  </main>

  <div class="toast" id="toast"></div>

  <script src="script.js"></script>
</body>
</html>
